<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="now-bar"><rect x="168" y="142" width="224" height="56" rx="8"/></clipPath>
  </defs>
  <rect x="1" y="1" width="898" height="288" rx="12" fill="#fffdf9" stroke="#e5e1d8" stroke-width="2"/>

  <!-- Before LLMs -->
  <text x="150" y="77" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">Before LLMs</text>
  <rect x="168" y="42" width="702" height="56" rx="8" fill="#f4f2ec" stroke="#b9b3a7" stroke-width="2"/>
  <text x="519" y="77" text-anchor="middle" font-size="18" fill="#1f2328">Specialists interview experts and model by hand</text>

  <!-- With LLMs -->
  <text x="150" y="177" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">With LLMs</text>
  <g clip-path="url(#now-bar)">
    <rect x="168" y="142" width="48" height="56" fill="#0b5cd5"/>
    <rect x="216" y="142" width="176" height="56" fill="#3d4450"/>
  </g>
  <rect x="418" y="146" width="16" height="16" rx="3" fill="#0b5cd5"/>
  <text x="444" y="160" font-size="17" fill="#1f2328">LLM draft: ~80% of the content, ~20% of the time</text>
  <rect x="418" y="176" width="16" height="16" rx="3" fill="#3d4450"/>
  <text x="444" y="190" font-size="17" fill="#1f2328">Human review: the last 20%, ~80% of the time</text>

  <!-- Time axis -->
  <g stroke="#5c6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 168 232 L 868 232"/>
    <path d="M 858 224 L 870 232 L 858 240"/>
  </g>
  <text x="168" y="262" font-size="16" fill="#5c6470">Time spent</text>
  <text x="870" y="262" text-anchor="end" font-size="16" font-style="italic" fill="#5c6470">Illustrative, not to scale</text>
</svg>
