<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6470"/>
    </marker>
    <clipPath id="now-bar"><rect x="168" y="572" width="150" height="44" rx="8"/></clipPath>
  </defs>
  <rect x="1" y="1" width="898" height="698" rx="12" fill="#fffdf9" stroke="#e5e1d8" stroke-width="2"/>

  <!-- The pipeline -->
  <text x="30" y="42" font-size="17" font-style="italic" fill="#5c6470">The pipeline: five ingredients, each steers one step</text>

  <!-- Ingredient tags -->
  <rect x="207" y="62" width="140" height="58" rx="8" fill="#ffffff" stroke="#0b5cd5" stroke-width="2"/>
  <circle cx="227" cy="80" r="11" fill="#0b5cd5"/>
  <text x="227" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="244" y="86" font-size="16" font-weight="700" fill="#0b5cd5">A method</text>
  <text x="277" y="108" text-anchor="middle" font-size="14" fill="#5c6470">ontology, sources</text>

  <rect x="561" y="62" width="317" height="58" rx="8" fill="#ffffff" stroke="#0b5cd5" stroke-width="2"/>
  <circle cx="581" cy="80" r="11" fill="#0b5cd5"/>
  <text x="581" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="598" y="86" font-size="16" font-weight="700" fill="#0b5cd5">Directives for the architecture</text>
  <text x="719" y="108" text-anchor="middle" font-size="14" fill="#5c6470">technologies, type of application</text>

  <g stroke="#0b5cd5" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M277 122 V186" marker-end="url(#arrow)"/>
    <path d="M631 122 V186" marker-end="url(#arrow)"/>
    <path d="M808 122 V186" marker-end="url(#arrow)"/>
  </g>

  <!-- Pipeline boxes -->
  <rect x="30" y="190" width="140" height="110" rx="10" fill="#f4f2ec" stroke="#b9b3a7" stroke-width="2"/>
  <circle cx="50" cy="208" r="11" fill="#0b5cd5"/>
  <text x="50" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="100" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Source</text>
  <text x="100" y="266" text-anchor="middle" font-size="15" fill="#5c6470">the reference,</text>
  <text x="100" y="286" text-anchor="middle" font-size="15" fill="#5c6470">not perfect</text>

  <rect x="207" y="190" width="140" height="110" rx="10" fill="#3d4450"/>
  <circle cx="227" cy="208" r="11" fill="#ffffff"/>
  <text x="227" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#3d4450">5</text>
  <text x="277" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Coding</text>
  <text x="277" y="263" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">agent</text>
  <text x="277" y="287" text-anchor="middle" font-size="15" fill="#ffffff">with freedom</text>

  <rect x="384" y="190" width="140" height="110" rx="10" fill="#0b5cd5"/>
  <text x="454" y="228" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Knowledge</text>
  <text x="454" y="251" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">model</text>
  <text x="454" y="274" text-anchor="middle" font-size="15" fill="#ffffff">requirements</text>
  <text x="454" y="292" text-anchor="middle" font-size="15" fill="#ffffff">and decisions</text>

  <rect x="561" y="190" width="140" height="110" rx="10" fill="#e6effc" stroke="#0b5cd5" stroke-width="2"/>
  <text x="631" y="228" text-anchor="middle" font-size="19" font-weight="700" fill="#0b5cd5">Generator</text>
  <text x="631" y="252" text-anchor="middle" font-size="15" fill="#0b5cd5">deterministic,</text>
  <text x="631" y="272" text-anchor="middle" font-size="15" fill="#0b5cd5">written by the</text>
  <text x="631" y="292" text-anchor="middle" font-size="15" fill="#0b5cd5">agent, frozen</text>

  <rect x="738" y="190" width="140" height="110" rx="10" fill="#f4f2ec" stroke="#b9b3a7" stroke-width="2"/>
  <text x="808" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Application</text>
  <text x="808" y="266" text-anchor="middle" font-size="15" fill="#5c6470">no knowledge</text>
  <text x="808" y="286" text-anchor="middle" font-size="15" fill="#5c6470">of the source</text>

  <g stroke="#5c6470" stroke-width="2" fill="none">
    <path d="M172 245 H203" marker-end="url(#arrow)"/>
    <path d="M349 245 H380" marker-end="url(#arrow)"/>
    <path d="M526 245 H557" marker-end="url(#arrow)"/>
    <path d="M703 245 H734" marker-end="url(#arrow)"/>
  </g>

  <!-- Acceptance test and the loop -->
  <rect x="738" y="340" width="140" height="66" rx="10" fill="#ffffff" stroke="#0b5cd5" stroke-width="2"/>
  <circle cx="758" cy="358" r="11" fill="#0b5cd5"/>
  <text x="758" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="818" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5cd5">Outcome</text>
  <text x="808" y="391" text-anchor="middle" font-size="15" fill="#0b5cd5">acceptance test</text>
  <g stroke="#5c6470" stroke-width="2" fill="none">
    <path d="M808 338 V304" marker-end="url(#arrow)"/>
    <path d="M736 380 H277 V304" marker-end="url(#arrow)"/>
  </g>
  <text x="790" y="326" text-anchor="end" font-size="14" fill="#5c6470">checks</text>
  <text x="500" y="372" text-anchor="middle" font-size="15" fill="#5c6470">the agent works until the test passes</text>

  <!-- The effort -->
  <path d="M30 440 H870" stroke="#e5e1d8" stroke-width="2"/>
  <text x="30" y="478" font-size="17" font-style="italic" fill="#5c6470">The effort</text>

  <text x="150" y="530" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">Before</text>
  <rect x="168" y="502" width="702" height="44" rx="8" fill="#f4f2ec" stroke="#b9b3a7" stroke-width="2"/>
  <text x="519" y="530" text-anchor="middle" font-size="17" fill="#1f2328">Specify, then implement: weeks to months</text>

  <text x="150" y="600" text-anchor="end" font-size="19" font-weight="700" fill="#1f2328">Now</text>
  <g clip-path="url(#now-bar)">
    <rect x="168" y="572" width="30" height="44" fill="#0b5cd5"/>
    <rect x="198" y="572" width="120" height="44" fill="#3d4450"/>
  </g>
  <rect x="344" y="574" width="16" height="16" rx="3" fill="#0b5cd5"/>
  <text x="370" y="588" font-size="16" fill="#1f2328">Agent: 20 to 40 minutes, about 80% of the result</text>
  <rect x="344" y="600" width="16" height="16" rx="3" fill="#3d4450"/>
  <text x="370" y="614" font-size="16" fill="#1f2328">Review and acceptance: a few hours, about 4 times more</text>

  <g stroke="#5c6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M168 646 L868 646"/>
    <path d="M858 638 L870 646 L858 654"/>
  </g>
  <text x="168" y="676" font-size="16" fill="#5c6470">Time spent</text>
  <text x="870" y="676" text-anchor="end" font-size="16" font-style="italic" fill="#5c6470">Illustrative, not to scale</text>
</svg>
